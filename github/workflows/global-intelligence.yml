name: Global Intelligence

# Builds global-intelligence/data/ from approved editorial records, four times a day
# (07:00, 12:00, 17:00, 22:00 ET; each fired for both EST and EDT) and on every record change.
on:
  schedule:
    - cron: "55 1,2,10,11,15,16,20,21 * * *"
  push:
    branches: [main]
    paths: ["global-intelligence/editorial/**", "scripts/tw/global_intel.py", "scripts/build_global.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-intelligence
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # TODO before production: pin these actions to full commit SHAs.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest tests.test_global -v
      - name: Build public data (blocked on any editorial-rule error)
        run: python scripts/build_global.py
      - name: Commit generated data
        run: |
          git config user.name "aegis-global-intel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add global-intelligence/data
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "Global Intelligence: data build $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
