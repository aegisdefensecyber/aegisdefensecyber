name: Global Intelligence

# Builds global-intelligence/data/ from approved editorial records four times a day
# (07:00, 12:00, 17:00, 22:00 ET) and on every record change. GitHub's cron drops fires on
# this repository, so it wakes every 15 minutes and a cheap gate job (scripts/slot_gate.py)
# decides whether the current slot still needs a build.
on:
  schedule:
    - cron: "12,27,42,57 * * * *"
  push:
    branches: [main]
    paths: ["global-intelligence/editorial/**", "scripts/tw/global_intel.py", "scripts/build_global.py", ".github/heartbeat"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-intelligence
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.gate.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/slot_gate.py
            global-intelligence/data/last-updated.json
          sparse-checkout-cone-mode: false
      - name: Is a build due?
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Triggered by ${{ github.event_name }}: running."; echo "due=true" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/slot_gate.py global
          fi

  build:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # TODO before production: pin these actions to full commit SHAs.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest tests.test_global -v
      - name: Build public data (blocked on any editorial-rule error)
        run: python scripts/build_global.py
      - name: Commit generated data
        run: |
          git config user.name "aegis-global-intel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add global-intelligence/data
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "Global Intelligence: data build $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
