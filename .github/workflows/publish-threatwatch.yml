name: Publish ThreatWatch

# Four updates a day at the 07:00, 12:00, 17:00 and 22:00 America/New_York slots.
# The 07:00 slot publishes the day's new edition (and emails subscribers); later
# slots refresh that edition with fresh data (website only).
# GitHub's cron is best effort and on this repository it drops most fires, so the
# workflow wakes every 15 minutes and a cheap gate job (scripts/slot_gate.py, sparse
# checkout, a few seconds) decides whether a slot is due. Only then do the tests and
# the full publish run. Manual runs, repository_dispatch and pull requests skip the gate.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths: [".github/heartbeat"]   # backup trigger: a scheduled task touches this file 4x a day
  repository_dispatch:
    types: [threatwatch-update]   # external scheduler (cron-job.org): wakes both workflows
  workflow_dispatch:
    inputs:
      force:
        description: "Run an update now even if this slot already ran"
        type: boolean
        default: false
      refresh_report:
        description: "Only re-compose today's brief document (after adding an editorial file)"
        type: boolean
        default: false
      send_email:
        description: "(Re)send today's morning email to subscribers"
        type: boolean
        default: false
  pull_request:
    paths: ["scripts/**", "tests/**", "threatwatch/**", ".github/workflows/publish-threatwatch.yml"]

permissions:
  contents: read

concurrency:
  group: threatwatch-publish
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.gate.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/slot_gate.py
            threatwatch/data/status.json
          sparse-checkout-cone-mode: false
      - name: Is an update slot due?
        id: gate
        run: |
          case "${{ github.event_name }}" in
            schedule|push|repository_dispatch) python3 scripts/slot_gate.py threatwatch ;;
            *) echo "Triggered by ${{ github.event_name }}: running."; echo "due=true" >> "$GITHUB_OUTPUT" ;;
          esac

  test:
    needs: gate
    if: always() && (github.event_name == 'pull_request' || needs.gate.outputs.due == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # TODO before merge: pin these actions to full commit SHAs.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (offline fixtures)
        run: python -m unittest discover -s tests -v
      - name: Validate committed public data
        run: python scripts/validate_data.py

  publish:
    needs: [gate, test]
    if: always() && github.event_name != 'pull_request' && needs.gate.outputs.due == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build brief and CVE catalog
        id: build
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          VULNCHECK_API_KEY: ${{ secrets.VULNCHECK_API_KEY }}
        run: |
          set +e
          if [ "${{ inputs.refresh_report }}" = "true" ]; then python scripts/build_brief.py --refresh-report
          elif [ "${{ inputs.force }}" = "true" ]; then python scripts/build_brief.py --force; else python scripts/build_brief.py; fi
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Commit generated data
        run: |
          git config user.name "aegis-threatwatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add threatwatch/data threatwatch/email 2>/dev/null || git add threatwatch/data
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "ThreatWatch: edition ${{ steps.build.outputs.edition || 'status update' }}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
      - name: Email the morning brief to subscribers (Zoho Campaigns)
        if: steps.build.outputs.published == 'true' || inputs.send_email == true
        continue-on-error: true   # email problems never fail or roll back the brief
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_LIST_KEY: ${{ secrets.ZOHO_LIST_KEY }}
          ZOHO_FROM_EMAIL: ${{ vars.ZOHO_FROM_EMAIL }}
          ZOHO_FROM_NAME: ${{ vars.ZOHO_FROM_NAME }}
          ZOHO_TOPIC_ID: ${{ vars.ZOHO_TOPIC_ID }}
          ZOHO_ACCOUNTS_URL: ${{ vars.ZOHO_ACCOUNTS_URL }}
          ZOHO_CAMPAIGNS_URL: ${{ vars.ZOHO_CAMPAIGNS_URL }}
        run: python scripts/send_digest.py
      - name: Fail if a quality gate blocked publication
        if: steps.build.outputs.exit != '0'
        run: |
          echo "::error::Publication blocked — see the 'Build brief' / 'Build CVE catalog' logs. Last good data remains live."
          exit 1
